# Nginx reverse proxy untuk HDB Airconds.
# Pasang di: /etc/nginx/sites-available/hdbairconds.id
# Aktifkan: ln -s /etc/nginx/sites-available/hdbairconds.id /etc/nginx/sites-enabled/
# Lalu jalankan certbot --nginx -d hdbairconds.id -d www.hdbairconds.id (upgrade otomatis ke HTTPS)

server {
    listen 80;
    listen [::]:80;
    server_name hdbairconds.id www.hdbairconds.id;

    client_max_body_size 10M;

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
